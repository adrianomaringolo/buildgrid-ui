name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run semantic-release
        run: |
          VERSION_BEFORE=$(node -p "require('./package.json').version")
          pnpm run release
          VERSION_AFTER=$(node -p "require('./package.json').version")
          if [ "$VERSION_BEFORE" != "$VERSION_AFTER" ]; then
            echo "NEW_RELEASE=true" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Get npm token via OIDC Trusted Publisher
        if: env.NEW_RELEASE == 'true'
        run: |
          OIDC_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
            | jq -r '.value')

          NPM_TOKEN=$(curl -fsSL -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/buildgrid-ui" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            | jq -r '.token')

          echo "::add-mask::$NPM_TOKEN"
          echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> $GITHUB_ENV
      - name: Publish to npm
        if: env.NEW_RELEASE == 'true'
        run: npm publish --provenance --access public
