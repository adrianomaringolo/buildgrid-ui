name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
